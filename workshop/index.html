<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>De Amicis Workshop</title><style>:root{--red:#d31320;--ink:#17191d;--muted:#747b84;--line:#e4e7eb;--bg:#f4f6f8;--green:#15865a;--blue:#2d70cf}*{box-sizing:border-box}body{margin:0;background:#dfe3e8;font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink)}.app{max-width:820px;margin:auto;min-height:100vh;background:var(--bg)}header{background:#15171a;color:#fff;padding:14px 16px;position:sticky;top:0;z-index:10}.logo{font-size:24px;font-weight:950;font-style:italic}.logo b{color:#ef2635}main{padding:14px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;margin-top:10px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.h1{font-size:24px;font-weight:950}.h2{font-weight:900}.sub{font-size:12px;color:var(--muted)}.hidden{display:none!important}.btn{width:100%;border:0;border-radius:12px;padding:12px;font-weight:900;margin-top:9px}.primary{background:var(--red);color:#fff}.dark{background:#17191d;color:#fff}.secondary{background:#fff;border:1px solid var(--line)}.small{width:auto;padding:8px 10px;margin:0}.field{margin-top:9px}.field label{display:block;font-size:11px;color:var(--muted);margin-bottom:4px}input,select,textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:11px;font:inherit;background:#fff}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}.tab{border:1px solid var(--line);background:#fff;border-radius:11px;padding:9px;font-weight:800;font-size:11px}.tab.on{background:#17191d;color:#fff}.job{padding:12px;border:1px solid var(--line);border-radius:14px;background:#fff;margin-top:8px}.plate{font-weight:950;border:1px solid #ccd2d8;border-radius:6px;padding:4px 7px;font-size:12px}.badge{display:inline-block;padding:5px 8px;border-radius:99px;font-size:10px;font-weight:900;background:#eef4ff;color:var(--blue)}.status{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin-top:10px}.sbtn{padding:10px;border:1px solid var(--line);border-radius:10px;background:#fff;font-weight:800}.sbtn.on{border:2px solid var(--red);color:var(--red)}.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:11px}.kpi strong{display:block;font-size:22px}.notice{padding:10px;border-radius:10px;background:#f3f7ff;margin-top:10px}.error{background:#fff1f2;color:#7b2028;padding:10px;border-radius:10px;margin-top:10px;font-size:12px}</style></head><body><div class="app"><header><div class="logo"><b>De</b> Amicis Workshop</div></header><main><section id="login"><div class="card"><div class="h1">Accesso staff</div><form id="loginForm"><div class="field"><label>Email</label><input id="email" value="davide@carrozzeriadeamicis.it" type="email" required></div><div class="field"><label>Password</label><input id="password" type="password" required></div><button class="btn dark">Accedi</button></form><div id="err" class="error hidden"></div></div></section><section id="home" class="hidden"><div class="row"><div><div class="h1">Workshop</div><div id="staffName" class="sub"></div></div><button class="btn secondary small" onclick="logout()">Esci</button></div><div class="kpis"><div class="kpi"><span class="sub">Lavori</span><strong id="kJobs">0</strong></div><div class="kpi"><span class="sub">Assegnati</span><strong id="kMine">0</strong></div><div class="kpi"><span class="sub">Pronte</span><strong id="kReady">0</strong></div></div><div class="tabs"><button class="tab on" onclick="switchPane('jobs',this)">Lavori</button><button class="tab" onclick="switchPane('mine',this)">I miei</button><button class="tab" onclick="switchPane('verify',this)">WinCar</button></div><div id="jobsPane"><div class="field"><input id="search" placeholder="Cerca targa, auto, cliente..." oninput="renderJobs()"></div><div id="jobsList"></div></div><div id="minePane" class="hidden"><div id="mineList"></div></div><div id="verifyPane" class="hidden"><div class="card"><div class="h2">Collega pratica WinCar</div><div class="sub">Solo uso interno officina.</div><div class="field"><label>Targa</label><input id="wkPlate" placeholder="AB123CD"></div><div class="field"><label>Numero pratica</label><input id="wkJob" placeholder="DEMO-0001"></div><button class="btn primary" onclick="lookupWinCar()">Cerca su WinCar</button><div id="wkResult" class="notice hidden"></div></div><div id="pendingList"></div></div></section><section id="detail" class="hidden"><button class="btn secondary small" onclick="backHome()">← Indietro</button><div class="card"><div class="row"><div><div id="dVehicle" class="h1"></div><div id="dCustomer" class="sub"></div></div><span id="dPlate" class="plate"></span></div><div style="margin-top:8px"><span id="dStatus" class="badge"></span></div><div id="dTitle" style="font-weight:900;margin-top:8px"></div></div><div class="card"><div class="h2">Assegnazione</div><div class="field"><label>Reparto</label><select id="department"><option value="mechanic">Meccanica</option><option value="bodywork">Carrozzeria</option><option value="both">Entrambi</option></select></div><div class="field"><label>Tecnico</label><select id="technician"></select></div><button class="btn dark" onclick="saveAssignment()">Salva</button></div><div class="card"><div class="h2">Stato lavorazione</div><div id="statusGrid" class="status"></div></div><div class="card"><div class="h2">Aggiornamento cliente</div><div class="field"><textarea id="updateText" rows="4" placeholder="Messaggio visibile al cliente"></textarea></div><button class="btn primary" onclick="publishUpdate()">Pubblica aggiornamento</button></div><div class="card"><div class="h2">Segnalazione tecnica</div><div class="field"><input id="issueTitle" placeholder="Titolo"></div><div class="field"><textarea id="issueText" rows="4" placeholder="Descrizione interna"></textarea></div><button class="btn secondary" onclick="saveIssue()">Salva segnalazione</button></div></section></main></div><script>const U='https://fbziopuitxwsihgqlvhq.supabase.co',K='sb_publishable_KS-pm6EChhHzgpAX572VTQ_OKWbzVX3',SK='deamicis_workshop_online';let S=null,ME=null,STAFF=[],C={},V={},J=[],LINK=[],CUR=null;const order=['accepted','diagnosis','estimate','working','final_check','ready','delivered'],SL={accepted:'Accettata',diagnosis:'Diagnosi',estimate:'Preventivo',working:'In lavorazione',final_check:'Controllo finale',ready:'Pronta',delivered:'Consegnata'};async function rest(path,opt={}){let h={apikey:K,'Content-Type':'application/json',...(opt.headers||{})};if(S?.access_token)h.Authorization='Bearer '+S.access_token;let r=await fetch(U+'/rest/v1/'+path,{...opt,headers:h});if(!r.ok)throw Error(await r.text());let t=await r.text();return t?JSON.parse(t):null}async function auth(path,body){let r=await fetch(U+path,{method:'POST',headers:{apikey:K,'Content-Type':'application/json'},body:JSON.stringify(body)});let d=await r.json();if(!r.ok)throw Error(d.msg||d.error_description||d.error||'Errore');return d}function save(){localStorage.setItem(SK,JSON.stringify(S))}function loadS(){try{return JSON.parse(localStorage.getItem(SK))}catch(e){return null}}loginForm.onsubmit=async e=>{e.preventDefault();err.classList.add('hidden');try{S=await auth('/auth/v1/token?grant_type=password',{email:email.value,password:password.value});save();await loadHome()}catch(x){err.textContent='Accesso non riuscito';err.classList.remove('hidden')}};async function loadHome(){let m=await rest('staff_profiles?select=*&id=eq.'+S.user.id+'&limit=1');ME=m?.[0];if(!ME||!ME.active)throw Error('Staff non abilitato');STAFF=await rest('staff_profiles?select=*&active=eq.true&order=first_name.asc')||[];J=await rest('jobs?select=*&order=created_at.desc')||[];let vids=[...new Set(J.map(x=>x.vehicle_id))];let vv=vids.length?await rest('vehicles?select=*&id=in.('+vids.join(',')+')')||[]:[];V=Object.fromEntries(vv.map(x=>[x.id,x]));let cids=[...new Set(vv.map(x=>x.customer_id))];let cc=cids.length?await rest('customers?select=id,first_name,last_name,phone,email&id=in.('+cids.join(',')+')')||[]:[];C=Object.fromEntries(cc.map(x=>[x.id,x]));try{LINK=await rest('vehicle_link_requests?select=*&order=created_at.desc')||[]}catch(e){LINK=[]}login.classList.add('hidden');home.classList.remove('hidden');staffName.textContent=ME.first_name+' '+ME.last_name+' · '+ME.role;kJobs.textContent=J.filter(x=>x.status!=='delivered').length;kMine.textContent=J.filter(x=>x.assigned_technician===S.user.id&&x.status!=='delivered').length;kReady.textContent=J.filter(x=>x.status==='ready').length;renderJobs();renderMine();renderPending()}function jobHtml(j){let v=V[j.vehicle_id]||{},c=C[v.customer_id]||{};return `<div class="job" onclick="openJob('${j.id}')"><div class="row"><div><b>${j.title||'Lavoro'}</b><div class="sub">${c.first_name||''} ${c.last_name||''} · ${v.brand||''} ${v.model||''}</div></div><span class="plate">${v.plate||''}</span></div><div style="margin-top:7px"><span class="badge">${SL[j.status]||j.status}</span></div></div>`}function renderJobs(){let q=(search.value||'').toLowerCase();let a=J.filter(j=>j.status!=='delivered').filter(j=>{let v=V[j.vehicle_id]||{},c=C[v.customer_id]||{};return [v.plate,v.brand,v.model,c.first_name,c.last_name,j.title].join(' ').toLowerCase().includes(q)});jobsList.innerHTML=a.length?a.map(jobHtml).join(''):'<div class="card sub">Nessun lavoro.</div>'}function renderMine(){let a=J.filter(j=>j.assigned_technician===S.user.id&&j.status!=='delivered');mineList.innerHTML=a.length?a.map(jobHtml).join(''):'<div class="card sub">Nessun lavoro assegnato.</div>'}function renderPending(){pendingList.innerHTML=LINK.filter(x=>['pending','not_found','matched'].includes(x.status)).map(r=>`<div class="card"><div class="row"><div><b>${r.plate}</b><div class="sub">Pratica ${r.wincar_job_number||'—'}</div></div><span class="badge">${r.status}</span></div></div>`).join('')||'<div class="card sub">Nessuna verifica in attesa.</div>'}function switchPane(p,b){document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));b.classList.add('on');jobsPane.classList.toggle('hidden',p!=='jobs');minePane.classList.toggle('hidden',p!=='mine');verifyPane.classList.toggle('hidden',p!=='verify')}function openJob(id){CUR=J.find(x=>x.id===id);let v=V[CUR.vehicle_id]||{},c=C[v.customer_id]||{};dVehicle.textContent=(v.brand||'')+' '+(v.model||'');dCustomer.textContent=(c.first_name||'')+' '+(c.last_name||'');dPlate.textContent=v.plate||'';dStatus.textContent=SL[CUR.status]||CUR.status;dTitle.textContent=CUR.title||'';department.value=CUR.department||'mechanic';technician.innerHTML='<option value="">Non assegnato</option>'+STAFF.filter(x=>x.role==='technician'||x.role==='admin').map(x=>`<option value="${x.id}">${x.first_name} ${x.last_name}</option>`).join('');technician.value=CUR.assigned_technician||'';statusGrid.innerHTML=order.map(s=>`<button class="sbtn ${s===CUR.status?'on':''}" onclick="changeStatus('${s}')">${SL[s]}</button>`).join('');home.classList.add('hidden');detail.classList.remove('hidden')}function backHome(){detail.classList.add('hidden');home.classList.remove('hidden');renderJobs();renderMine()}async function saveAssignment(){await rest('jobs?id=eq.'+CUR.id,{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({department:department.value,assigned_technician:technician.value||null,updated_at:new Date().toISOString()})});CUR.department=department.value;CUR.assigned_technician=technician.value||null;alert('Assegnazione aggiornata')}async function changeStatus(s){await rest('jobs?id=eq.'+CUR.id,{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({status:s,updated_at:new Date().toISOString()})});CUR.status=s;dStatus.textContent=SL[s];statusGrid.innerHTML=order.map(x=>`<button class="sbtn ${x===s?'on':''}" onclick="changeStatus('${x}')">${SL[x]}</button>`).join('');await rest('job_updates',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify({job_id:CUR.id,status:s,message:'Stato lavorazione: '+SL[s],visible_to_customer:true,created_by:S.user.id})})}async function publishUpdate(){let t=updateText.value.trim();if(!t)return;await rest('job_updates',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify({job_id:CUR.id,status:CUR.status,message:t,visible_to_customer:true,created_by:S.user.id})});updateText.value='';alert('Aggiornamento pubblicato')}async function saveIssue(){let t=issueTitle.value.trim();if(!t)return alert('Inserisci un titolo');await rest('technical_issues',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify({job_id:CUR.id,title:t,description:issueText.value.trim(),severity:'warning',status:'reported',technician_id:S.user.id,customer_visible:false})});issueTitle.value='';issueText.value='';alert('Segnalazione salvata')}async function lookupWinCar(){let plate=wkPlate.value.trim().toUpperCase().replace(/\s/g,''),job=wkJob.value.trim();if(!plate||!job)return alert('Inserisci targa e numero pratica');wkResult.classList.add('hidden');try{let r=await fetch(U+'/functions/v1/wincar-lookup',{method:'POST',headers:{apikey:K,Authorization:'Bearer '+S.access_token,'Content-Type':'application/json'},body:JSON.stringify({plate,job_number:job})});let d=await r.json();if(!r.ok)throw Error(d.error||'Errore');wkResult.classList.remove('hidden');if(d.found){wkResult.innerHTML='<b>Pratica trovata</b><br>'+((d.vehicle?.brand||'')+' '+(d.vehicle?.model||''))+' · '+plate+'<br>Pratica '+job}else{wkResult.innerHTML='<b>Nessuna corrispondenza</b><br>La pratica non è nella cache locale. Quando HTS abiliterà l’accesso, la ricerca interrogherà WinCar direttamente.'}}catch(e){wkResult.classList.remove('hidden');wkResult.textContent='Errore collegamento: '+e.message}}async function logout(){localStorage.removeItem(SK);S=null;home.classList.add('hidden');detail.classList.add('hidden');login.classList.remove('hidden')}(async()=>{S=loadS();if(S?.access_token){try{await loadHome()}catch(e){localStorage.removeItem(SK)}}})();</script></body></html>

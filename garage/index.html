<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>De Amicis Garage</title><style>:root{--r:#d31320;--i:#17191d;--m:#747b84;--l:#e3e7eb;--b:#f4f6f8;--g:#16845a;--a:#d78918}*{box-sizing:border-box}body{margin:0;background:#dde2e7;font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:var(--i)}.app{max-width:760px;margin:auto;min-height:100vh;background:var(--b);padding-bottom:28px}header{position:sticky;top:0;z-index:20;background:#15171a;color:#fff;padding:13px 16px}.logo{font-size:23px;font-weight:950;font-style:italic}.logo b{color:#f12a37}main{padding:14px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.card{background:#fff;border:1px solid var(--l);border-radius:18px;padding:14px;margin-top:10px}.h1{font-size:24px;font-weight:950}.h2{font-weight:900}.sub{font-size:12px;color:var(--m)}.hidden{display:none!important}.btn{width:100%;padding:12px;border:0;border-radius:12px;font-weight:900;margin-top:9px}.dark{background:#17191d;color:#fff}.primary{background:var(--r);color:#fff}.secondary{background:#fff;border:1px solid var(--l)}.small{width:auto;padding:8px 10px;margin:0;font-size:11px}input,select,textarea{width:100%;padding:11px;border:1px solid var(--l);border-radius:11px;font:inherit;background:#fff}.field{margin-top:9px}.field label{display:block;font-size:11px;color:var(--m);margin-bottom:4px}.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-top:10px}.tab{border:1px solid var(--l);background:#fff;border-radius:10px;padding:8px 4px;font-size:10px;font-weight:850}.tab.on{background:#17191d;color:#fff}.chips{display:flex;gap:7px;overflow:auto;padding:2px 0}.chip{white-space:nowrap;border:1px solid var(--l);background:#fff;border-radius:99px;padding:8px 11px;font-weight:800}.chip.on{background:#17191d;color:#fff}.plate{font-size:11px;font-weight:900;border:1px solid #cbd1d7;border-radius:6px;padding:3px 6px}.badge{display:inline-block;padding:5px 8px;border-radius:99px;font-size:10px;font-weight:900}.red{background:#fff0f1;color:var(--r)}.green{background:#eaf8f1;color:var(--g)}.amber{background:#fff5e8;color:var(--a)}.gray{background:#eef1f4;color:#59616c}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.quick{border:1px solid var(--l);border-radius:14px;padding:12px;background:#fff}.summer{background:#fff7dd}.winter{background:#eaf4ff}.phaseHero{display:flex;align-items:center;gap:12px;border:1px solid var(--l);border-radius:16px;padding:12px;margin-top:10px;background:#fff}.phaseIcon{width:76px;height:76px;border-radius:18px;background:#fff0f1;display:grid;place-items:center;font-size:34px}.phaseList{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:10px}.phase{border:1px solid var(--l);border-radius:10px;padding:7px 3px;text-align:center;font-size:9px;background:#fff}.phase.on{border:2px solid var(--r);padding:6px 2px}.phase .e{font-size:18px}.step{border:1px solid var(--l);border-radius:12px;padding:10px;margin-top:7px}.quoteAmount{font-size:24px;font-weight:950}.error{background:#fff1f2;color:#7b2028;padding:10px;border-radius:10px;margin-top:10px;font-size:12px}@media(max-width:560px){.phaseList{grid-template-columns:repeat(4,1fr)}.tabs{grid-template-columns:repeat(5,1fr)}.tab{font-size:9px}}</style></head><body><div class="app"><header><div class="logo"><b>De</b> Amicis Garage</div></header><main><section id="login"><div class="card"><div class="h1">Il tuo Garage</div><div class="sub">Veicoli, lavori, scadenze e richieste in un unico posto.</div><form id="loginForm"><div class="field"><label>Email</label><input id="email" type="email" required></div><div class="field"><label>Password</label><input id="password" type="password" required></div><button class="btn dark">Accedi</button></form><button class="btn secondary" onclick="showSignup()">Registrati</button><div id="loginErr" class="error hidden"></div></div></section><section id="signup" class="hidden"><div class="card"><div class="h1">Registrati</div><div class="grid2"><div class="field"><label>Nome</label><input id="sgName"></div><div class="field"><label>Cognome</label><input id="sgSurname"></div></div><div class="field"><label>Telefono</label><input id="sgPhone"></div><div class="field"><label>Email</label><input id="sgEmail" type="email"></div><div class="field"><label>Password</label><input id="sgPassword" type="password"></div><label class="sub"><input id="sgMarketing" type="checkbox" style="width:auto"> Consenso comunicazioni promozionali</label><button class="btn primary" onclick="signupUser()">Crea account</button><button class="btn secondary" onclick="showLogin()">Torna al login</button></div></section><section id="home" class="hidden"><div class="row"><div><div class="h1">Garage</div><div id="hello" class="sub"></div></div><button class="btn secondary small" onclick="logout()">Esci</button></div><div class="tabs"><button class="tab on" onclick="switchTab('garage',this)">🚗<br>Garage</button><button class="tab" onclick="switchTab('history',this)">🧾<br>Storico</button><button class="tab" onclick="switchTab('appointments',this)">📅<br>Appunt.</button><button class="tab" onclick="switchTab('quotes',this)">💶<br>Preventivi</button><button class="tab" onclick="switchTab('profile',this)">👤<br>Profilo</button></div><div id="garagePane"><div class="card"><div class="row"><div><div class="h2">Le tue vetture</div><div class="sub">Seleziona o aggiungi un veicolo.</div></div><button class="btn secondary small" onclick="toggleAdd()">+ Auto</button></div><div id="chips" class="chips" style="margin-top:10px"></div><div id="addForm" class="hidden"><div class="field"><label>Targa</label><input id="carPlate"></div><div class="grid2"><div class="field"><label>Marca</label><input id="carBrand"></div><div class="field"><label>Modello</label><input id="carModel"></div></div><div class="grid2"><div class="field"><label>Km attuali</label><input id="carKm" type="number"></div><div class="field"><label>Assicurazione</label><input id="carInsurance" type="date"></div></div><div class="field"><label>Revisione</label><input id="carInspection" type="date"></div><button class="btn primary" onclick="addVehicle()">Salva vettura</button></div></div><div id="vehicleDetail"></div></div><div id="historyPane" class="hidden"></div><div id="appointmentsPane" class="hidden"><div class="card"><div class="h2">Richiedi appuntamento</div><div class="field"><label>Intervento</label><input id="reqService" placeholder="Es. tagliando, carrozzeria..."></div><div class="field"><label>Data/orario preferito</label><input id="reqDate" type="datetime-local"></div><button class="btn primary" onclick="requestAppointment()">Invia richiesta</button></div><div id="appointmentsList"></div></div><div id="quotesPane" class="hidden"><div class="card"><div class="h2">Richiedi preventivo</div><div class="field"><label>Categoria</label><select id="quoteCategory"><option value="insurance">Assicurazione</option><option value="tyres">Pneumatici</option></select></div><div class="field"><label>Note</label><textarea id="quoteNote"></textarea></div><button class="btn primary" onclick="requestQuote()">Invia richiesta</button></div><div id="quotesList"></div></div><div id="profilePane" class="hidden"></div></section></main></div><script>const U='https://fbziopuitxwsihgqlvhq.supabase.co',K='sb_publishable_KS-pm6EChhHzgpAX572VTQ_OKWbzVX3',SK='deamicis_garage_v11';let S=null,C=null,V=[],J=[],H=[],UP=[],Q=[],A=[],idx=0;const SO=['accepted','diagnosis','estimate','working','final_check','ready','delivered'],SL={accepted:'Accettata',diagnosis:'Diagnosi',estimate:'Preventivo',working:'In lavorazione',final_check:'Controllo finale',ready:'Pronta',delivered:'Consegnata'},PE={accepted:'✅',diagnosis:'🔎',estimate:'📋',working:'🔧',final_check:'🧾',ready:'✨',delivered:'🔑'};async function rest(path,opt={}){let h={apikey:K,'Content-Type':'application/json',...(opt.headers||{})};if(S?.access_token)h.Authorization='Bearer '+S.access_token;let r=await fetch(U+'/rest/v1/'+path,{...opt,headers:h});if(!r.ok)throw Error(await r.text());let t=await r.text();return t?JSON.parse(t):null}async function auth(path,body){let r=await fetch(U+path,{method:'POST',headers:{apikey:K,'Content-Type':'application/json'},body:JSON.stringify(body)});let d=await r.json();if(!r.ok)throw Error(d.msg||d.error_description||d.error||'Errore');return d}function save(){localStorage.setItem(SK,JSON.stringify(S))}function loadS(){try{return JSON.parse(localStorage.getItem(SK))}catch(e){return null}}function showSignup(){login.classList.add('hidden');signup.classList.remove('hidden')}function showLogin(){signup.classList.add('hidden');login.classList.remove('hidden')}loginForm.onsubmit=async e=>{e.preventDefault();loginErr.classList.add('hidden');try{S=await auth('/auth/v1/token?grant_type=password',{email:email.value,password:password.value});save();await loadHome()}catch(x){loginErr.textContent='Accesso non riuscito';loginErr.classList.remove('hidden')}};async function signupUser(){try{let d=await auth('/auth/v1/signup',{email:sgEmail.value,password:sgPassword.value,data:{first_name:sgName.value,last_name:sgSurname.value,phone:sgPhone.value,marketing_consent:sgMarketing.checked}});alert(d.access_token?'Account creato.':'Account creato. Controlla la tua email.');if(d.access_token){S=d;save();await loadHome()}else showLogin()}catch(e){alert('Registrazione non riuscita')}}async function loadHome(){let me=await rest('customers?select=*&auth_user_id=eq.'+S.user.id+'&limit=1');C=me?.[0];if(!C)throw Error('Profilo cliente non trovato');V=await rest('vehicles?select=id,plate,brand,model,insurance_expiry,inspection_expiry,tyre_type,tyre_change_period,verification_status,source&customer_id=eq.'+C.id+'&order=created_at.asc')||[];let ids=V.map(x=>x.id);J=ids.length?await rest('jobs?select=id,vehicle_id,title,description,status,expected_delivery,created_at&vehicle_id=in.('+ids.join(',')+')&visible_to_customer=eq.true&order=created_at.desc')||[]:[];H=ids.length?await rest('service_history?select=id,vehicle_id,service_date,km,title,description&vehicle_id=in.('+ids.join(',')+')&order=service_date.desc')||[]:[];UP=J.length?await rest('job_updates?select=id,job_id,status,message,created_at&job_id=in.('+J.map(x=>x.id).join(',')+')&visible_to_customer=eq.true&order=created_at.desc')||[]:[];A=await rest('appointments?select=id,vehicle_id,requested_service,start_time,status,created_at&customer_id=eq.'+C.id+'&order=created_at.desc')||[];Q=await rest('quote_requests?select=id,vehicle_id,category,status,customer_note,staff_note,amount,valid_until,created_at&customer_id=eq.'+C.id+'&order=created_at.desc')||[];idx=Math.min(idx,Math.max(0,V.length-1));login.classList.add('hidden');signup.classList.add('hidden');home.classList.remove('hidden');hello.textContent='Ciao '+C.first_name;renderAll()}function tyre(){let n=new Date(),m=n.getMonth()+1,d=n.getDate(),s=(m>4&&m<11)||(m===4&&d>=15)||(m===11&&d<=15);return s?['summer','☀️','Periodo estivo','Pneumatici estivi consigliati']:['winter','❄️','Periodo invernale','Obbligo pneumatici invernali o dotazione invernale']}function fd(x){return x?new Date(x+'T12:00:00').toLocaleDateString('it-IT'):'—'}function fdt(x){return x?new Date(x).toLocaleString('it-IT',{dateStyle:'short',timeStyle:'short'}):'Da concordare'}function left(x){if(!x)return'';let n=Math.ceil((new Date(x+'T23:59:59')-new Date())/86400000);return n>=0?'Mancano '+n+' giorni':'Scaduta da '+Math.abs(n)+' giorni'}function last(v){return H.find(x=>x.vehicle_id===v.id&&x.km)}function active(v){return J.find(x=>x.vehicle_id===v.id&&x.status!=='delivered')||J.find(x=>x.vehicle_id===v.id)}function renderAll(){chips.innerHTML=V.map((v,i)=>`<button class="chip ${i===idx?'on':''}" onclick="selectVehicle(${i})">${v.plate}</button>`).join('');renderVehicle();renderHistory();renderAppointments();renderQuotes();profilePane.innerHTML=`<div class="card"><div class="h2">Profilo</div><div style="font-weight:900">${C.first_name} ${C.last_name}</div><div class="sub">${C.email||''}</div><div class="sub">${C.phone||''}</div></div>`}function selectVehicle(i){idx=i;renderAll()}function renderVehicle(){if(!V.length){vehicleDetail.innerHTML='<div class="card sub">Aggiungi la tua prima vettura.</div>';return}let v=V[idx],j=active(v),h=last(v),t=tyre();let ph=j?`<div class="phaseHero"><div class="phaseIcon">🚗${PE[j.status]||''}</div><div><div class="sub">Stato lavorazione</div><div class="h2">${SL[j.status]||j.status}</div><div class="sub">${j.title||''}</div></div></div><div class="phaseList">${SO.map(s=>`<div class="phase ${s===j.status?'on':''}"><div class="e">${PE[s]}</div>${SL[s]}</div>`).join('')}</div>`:'';let ups=j?UP.filter(x=>x.job_id===j.id).slice(0,5):[];vehicleDetail.innerHTML=`<div class="card"><div class="row"><div><div class="h1">${v.brand||''} ${v.model||''}</div><div class="sub">Ultimo intervento: ${h?h.km+' km · '+fd(h.service_date):'—'}</div></div><span class="plate">${v.plate}</span></div></div><div class="card"><div class="grid2"><div class="quick ${t[0]}"><div style="font-size:25px">${t[1]}</div><b>${t[2]}</b><div class="sub">${t[3]}</div></div><div class="quick"><div class="sub">Assicurazione</div><b>${fd(v.insurance_expiry)}</b><div class="sub">${left(v.insurance_expiry)}</div></div><div class="quick"><div class="sub">Revisione</div><b>${fd(v.inspection_expiry)}</b></div><div class="quick"><div class="sub">Km ultimo intervento</div><b>${h?h.km+' km':'—'}</b></div></div></div>${j?`<div class="card"><div class="row"><div><div class="h2">${j.title||'Lavorazione'}</div><div class="sub">${j.description||''}</div></div><span class="badge red">${SL[j.status]||j.status}</span></div>${ph}<div class="sub" style="margin-top:10px">Consegna prevista: ${j.expected_delivery?fdt(j.expected_delivery):'—'}</div>${ups.map(u=>`<div class="step"><b>${SL[u.status]||u.status||'Aggiornamento'}</b><div class="sub">${u.message||''} · ${fdt(u.created_at)}</div></div>`).join('')}</div>`:'<div class="card sub">Nessuna lavorazione attiva.</div>'}`}function renderHistory(){if(!V.length){historyPane.innerHTML='<div class="card sub">Nessun veicolo.</div>';return}let v=V[idx],a=H.filter(x=>x.vehicle_id===v.id);historyPane.innerHTML='<div class="card"><div class="h2">Storico · '+v.plate+'</div>'+(a.length?a.map(h=>`<div class="step"><b>${h.title}</b><div class="sub">${fd(h.service_date)}${h.km?' · '+h.km+' km':''}</div><div class="sub">${h.description||''}</div></div>`).join(''):'<div class="sub">Nessun intervento registrato.</div>')+'</div>'}function renderAppointments(){appointmentsList.innerHTML=A.length?A.map(a=>{let v=V.find(x=>x.id===a.vehicle_id)||{};return `<div class="card"><div class="row"><div><b>${a.requested_service||'Appuntamento'}</b><div class="sub">${v.plate||''}</div></div><span class="badge ${a.status==='confirmed'?'green':a.status==='cancelled'?'gray':'amber'}">${a.status}</span></div><div class="sub" style="margin-top:6px">${fdt(a.start_time)}</div></div>`}).join(''):'<div class="card sub">Nessun appuntamento.</div>'}function renderQuotes(){if(!V.length){quotesList.innerHTML='<div class="card sub">Aggiungi prima una vettura.</div>';return}let v=V[idx],a=Q.filter(x=>x.vehicle_id===v.id),ql={requested:'Richiesto',in_progress:'In lavorazione',sent:'Preventivo disponibile',accepted:'Accettato',declined:'Rifiutato',expired:'Scaduto'};quotesList.innerHTML=a.length?a.map(q=>`<div class="card"><div class="row"><b>${q.category==='insurance'?'Assicurazione':'Pneumatici'}</b><span class="badge ${q.status==='accepted'?'green':q.status==='sent'?'red':'amber'}">${ql[q.status]||q.status}</span></div>${q.amount?`<div class="quoteAmount">€ ${Number(q.amount).toFixed(2)}</div>`:''}${q.staff_note?`<div class="sub">${q.staff_note}</div>`:''}${q.valid_until?`<div class="sub">Valido fino al ${fd(q.valid_until)}</div>`:''}${q.status==='sent'?`<div class="grid2"><button class="btn primary" onclick="quoteDecision('${q.id}','accepted')">Accetta</button><button class="btn secondary" onclick="quoteDecision('${q.id}','declined')">Rifiuta</button></div>`:''}</div>`).join(''):'<div class="card sub">Nessun preventivo per questa vettura.</div>'}function toggleAdd(){addForm.classList.toggle('hidden')}async function addVehicle(){let p=carPlate.value.trim().toUpperCase().replace(/\s/g,'');if(!p)return alert('Inserisci la targa');await rest('vehicles',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify({customer_id:C.id,plate:p,brand:carBrand.value.trim(),model:carModel.value.trim(),current_km:Number(carKm.value)||null,insurance_expiry:carInsurance.value||null,inspection_expiry:carInspection.value||null,source:'customer',verification_status:'pending'})});await loadHome()}async function requestAppointment(){if(!V.length)return alert('Aggiungi prima una vettura');if(!reqService.value.trim())return alert('Inserisci il tipo di intervento');let body={customer_id:C.id,vehicle_id:V[idx].id,requested_service:reqService.value.trim(),status:'requested'};if(reqDate.value)body.start_time=new Date(reqDate.value).toISOString();await rest('appointments',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify(body)});reqService.value='';reqDate.value='';await loadHome();switchTab('appointments',document.querySelectorAll('.tab')[2])}async function requestQuote(){if(!V.length)return alert('Aggiungi prima una vettura');await rest('quote_requests',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify({customer_id:C.id,vehicle_id:V[idx].id,category:quoteCategory.value,status:'requested',customer_note:quoteNote.value.trim()||null})});quoteNote.value='';await loadHome();switchTab('quotes',document.querySelectorAll('.tab')[3])}async function quoteDecision(id,status){await rest('quote_requests?id=eq.'+id,{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({status,updated_at:new Date().toISOString()})});await loadHome();switchTab('quotes',document.querySelectorAll('.tab')[3])}function switchTab(p,b){document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));b.classList.add('on');['garage','history','appointments','quotes','profile'].forEach(x=>document.getElementById(x+'Pane').classList.toggle('hidden',x!==p))}async function logout(){localStorage.removeItem(SK);S=null;home.classList.add('hidden');login.classList.remove('hidden')}(async()=>{S=loadS();if(S?.access_token){try{await loadHome();return}catch(e){localStorage.removeItem(SK)}}})();</script></body></html>

<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>De Amicis Garage</title><style>:root{--red:#d31320;--ink:#17191d;--muted:#747b84;--line:#e4e7eb;--bg:#f4f6f8}*{box-sizing:border-box}body{margin:0;background:#dfe3e8;font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink)}.app{max-width:760px;margin:auto;min-height:100vh;background:var(--bg)}header{background:#15171a;color:#fff;padding:14px 16px;position:sticky;top:0;z-index:10}.logo{font-size:24px;font-weight:950;font-style:italic}.logo b{color:#ef2635}main{padding:14px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;margin-top:10px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.h1{font-size:24px;font-weight:950}.h2{font-weight:900}.sub{font-size:12px;color:var(--muted)}.hidden{display:none!important}.btn{width:100%;border:0;border-radius:12px;padding:12px;font-weight:900;margin-top:9px}.primary{background:var(--red);color:#fff}.dark{background:#17191d;color:#fff}.secondary{background:#fff;border:1px solid var(--line)}.small{width:auto;padding:8px 10px;margin:0}input,select,textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:11px;font:inherit;background:#fff}.field{margin-top:9px}.field label{display:block;font-size:11px;color:var(--muted);margin-bottom:4px}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}.tab{border:1px solid var(--line);background:#fff;border-radius:11px;padding:9px;font-weight:800;font-size:11px}.tab.on{background:#17191d;color:#fff}.vehicle{padding:12px;border:1px solid var(--line);border-radius:14px;margin-top:8px;background:#fff}.plate{font-weight:950;border:1px solid #ccd2d8;border-radius:6px;padding:4px 7px;font-size:12px}.badge{display:inline-block;padding:5px 8px;border-radius:99px;font-size:10px;font-weight:900;background:#fff0f1;color:var(--red)}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.quick{border:1px solid var(--line);border-radius:14px;padding:12px}.quick.summer{background:#fff7d9}.quick.winter{background:#eaf4ff}.big{font-size:24px;font-weight:950}.timeline{display:grid;gap:7px}.step{padding:10px;border:1px solid var(--line);border-radius:12px;background:#fff}.step.on{border:2px solid var(--red)}.error{background:#fff1f2;color:#7b2028;padding:10px;border-radius:10px;margin-top:10px;font-size:12px}</style></head><body><div class="app"><header><div class="logo"><b>De</b> Amicis Garage</div></header><main><section id="login"><div class="card"><div class="h1">Il tuo Garage</div><div class="sub">Accedi per vedere veicoli, lavori, scadenze e richieste.</div><form id="loginForm"><div class="field"><label>Email</label><input id="email" type="email" required></div><div class="field"><label>Password</label><input id="password" type="password" required></div><button class="btn dark">Accedi</button></form><button class="btn secondary" onclick="showSignup()">Registrati</button><div id="loginErr" class="error hidden"></div></div></section><section id="signup" class="hidden"><div class="card"><div class="h1">Registrati</div><div class="field"><label>Nome</label><input id="sgName"></div><div class="field"><label>Cognome</label><input id="sgSurname"></div><div class="field"><label>Telefono</label><input id="sgPhone"></div><div class="field"><label>Email</label><input id="sgEmail" type="email"></div><div class="field"><label>Password</label><input id="sgPassword" type="password"></div><button class="btn primary" onclick="signupUser()">Crea account</button><button class="btn secondary" onclick="showLogin()">Torna al login</button></div></section><section id="home" class="hidden"><div class="row"><div><div class="h1">Garage</div><div id="hello" class="sub"></div></div><button class="btn secondary small" onclick="logout()">Esci</button></div><div class="tabs"><button class="tab on" onclick="switchTab('garage',this)">Garage</button><button class="tab" onclick="switchTab('history',this)">Storico</button><button class="tab" onclick="switchTab('quotes',this)">Preventivi</button><button class="tab" onclick="switchTab('profile',this)">Profilo</button></div><div id="garagePane"><div class="card"><div class="row"><div><div class="h2">Le tue vetture</div><div class="sub">Aggiungi una vettura personale.</div></div><button class="btn secondary small" onclick="toggleAdd()">+ Auto</button></div><div id="addForm" class="hidden"><div class="field"><label>Targa</label><input id="carPlate"></div><div class="grid2"><div class="field"><label>Marca</label><input id="carBrand"></div><div class="field"><label>Modello</label><input id="carModel"></div></div><div class="grid2"><div class="field"><label>Km attuali</label><input id="carKm" type="number"></div><div class="field"><label>Assicurazione</label><input id="carInsurance" type="date"></div></div><div class="field"><label>Revisione</label><input id="carInspection" type="date"></div><button class="btn primary" onclick="addVehicle()">Salva vettura</button></div></div><div id="vehicles"></div><div id="detail"></div></div><div id="historyPane" class="hidden"></div><div id="quotesPane" class="hidden"></div><div id="profilePane" class="hidden"></div></section></main></div><script>const U='https://fbziopuitxwsihgqlvhq.supabase.co',K='sb_publishable_KS-pm6EChhHzgpAX572VTQ_OKWbzVX3',SK='deamicis_garage_online';let S=null,C=null,V=[],J=[],H=[],Q=[];const statuses={accepted:'Accettata',diagnosis:'Diagnosi',estimate:'Preventivo',working:'In lavorazione',final_check:'Controllo finale',ready:'Pronta',delivered:'Consegnata'};async function req(path,opt={}){let h={'apikey':K,'Content-Type':'application/json',...(opt.headers||{})};if(S?.access_token)h.Authorization='Bearer '+S.access_token;let r=await fetch(U+'/rest/v1/'+path,{...opt,headers:h});if(!r.ok)throw Error(await r.text());let t=await r.text();return t?JSON.parse(t):null}async function auth(path,body){let r=await fetch(U+path,{method:'POST',headers:{apikey:K,'Content-Type':'application/json'},body:JSON.stringify(body)});let d=await r.json();if(!r.ok)throw Error(d.msg||d.error_description||d.error||'Errore');return d}function save(){localStorage.setItem(SK,JSON.stringify(S))}function loadS(){try{return JSON.parse(localStorage.getItem(SK))}catch(e){return null}}function showSignup(){login.classList.add('hidden');signup.classList.remove('hidden')}function showLogin(){signup.classList.add('hidden');login.classList.remove('hidden')}loginForm.onsubmit=async e=>{e.preventDefault();loginErr.classList.add('hidden');try{S=await auth('/auth/v1/token?grant_type=password',{email:email.value,password:password.value});save();await loadHome()}catch(x){loginErr.textContent='Accesso non riuscito';loginErr.classList.remove('hidden')}};async function signupUser(){try{let d=await auth('/auth/v1/signup',{email:sgEmail.value,password:sgPassword.value,data:{first_name:sgName.value,last_name:sgSurname.value,phone:sgPhone.value}});alert(d.access_token?'Account creato. Accesso effettuato.':'Account creato. Controlla la tua email.');if(d.access_token){S=d;save();await loadHome()}else showLogin()}catch(e){alert('Registrazione non riuscita: '+e.message)}}async function loadHome(){let me=await req('customers?select=*&auth_user_id=eq.'+S.user.id+'&limit=1');C=me?.[0];if(!C)throw Error('Profilo cliente non trovato');V=await req('vehicles?select=*&customer_id=eq.'+C.id+'&order=created_at.desc')||[];let ids=V.map(x=>x.id);J=ids.length?await req('jobs?select=*&vehicle_id=in.('+ids.join(',')+')&visible_to_customer=eq.true&order=created_at.desc')||[]:[];H=ids.length?await req('service_history?select=*&vehicle_id=in.('+ids.join(',')+')&order=service_date.desc')||[]:[];Q=await req('quote_requests?select=*&customer_id=eq.'+C.id+'&order=created_at.desc')||[];login.classList.add('hidden');signup.classList.add('hidden');home.classList.remove('hidden');hello.textContent=C.first_name+' '+C.last_name;render()}function tyreInfo(){let n=new Date(),m=n.getMonth()+1,d=n.getDate(),summer=(m>4&&m<11)||(m===4&&d>=15)||(m===11&&d<=15);return summer?{c:'summer',i:'☀️',t:'Periodo estivo',d:'Pneumatici estivi consigliati'}:{c:'winter',i:'❄️',t:'Periodo invernale',d:'Obbligo pneumatici invernali o dotazione invernale'}}function fmtDate(x){if(!x)return'—';return new Date(x+'T12:00:00').toLocaleDateString('it-IT')}function days(x){if(!x)return'';let n=Math.ceil((new Date(x+'T23:59:59')-new Date())/86400000);return n>=0?'Mancano '+n+' giorni':'Scaduta da '+Math.abs(n)+' giorni'}function render(){vehicles.innerHTML=V.length?V.map(v=>`<div class="vehicle" onclick="openVehicle('${v.id}')"><div class="row"><div><b>${v.brand||''} ${v.model||''}</b><div class="sub">Ultimo intervento: ${lastKm(v.id)}</div></div><span class="plate">${v.plate}</span></div></div>`).join(''):'<div class="card sub">Nessuna vettura.</div>';historyPane.innerHTML='<div class="card"><div class="h2">Storico interventi</div>'+((H.length?H.map(h=>`<div class="step"><b>${h.title}</b><div class="sub">${fmtDate(h.service_date)} · ${h.km? h.km+' km':''}</div><div class="sub">${h.description||''}</div></div>`).join(''):'<div class="sub">Nessun intervento registrato.</div>'))+'</div>';quotesPane.innerHTML='<div class="card"><div class="h2">Preventivi</div><button class="btn primary" onclick="newQuote()">Richiedi preventivo</button>'+(Q.length?Q.map(q=>`<div class="step"><b>${q.category==='insurance'?'Assicurazione':'Pneumatici'}</b> <span class="badge">${q.status}</span><div class="sub">${q.amount?'€ '+Number(q.amount).toFixed(2):'In lavorazione'}</div><div class="sub">${q.staff_note||q.customer_note||''}</div></div>`).join(''):'<div class="sub" style="margin-top:8px">Nessuna richiesta.</div>')+'</div>';profilePane.innerHTML=`<div class="card"><div class="h2">Profilo</div><div>${C.first_name} ${C.last_name}</div><div class="sub">${C.email||''}</div><div class="sub">${C.phone||''}</div></div>`}function lastKm(id){let h=H.find(x=>x.vehicle_id===id&&x.km);return h?h.km+' km':'—'}function openVehicle(id){let v=V.find(x=>x.id===id),j=J.find(x=>x.vehicle_id===id&&x.status!=='delivered')||J.find(x=>x.vehicle_id===id),t=tyreInfo();detail.innerHTML=`<div class="card"><div class="row"><div><div class="h1">${v.brand||''} ${v.model||''}</div><div class="sub">Km ultimo intervento: ${lastKm(v.id)}</div></div><span class="plate">${v.plate}</span></div></div><div class="card"><div class="grid2"><div class="quick ${t.c}"><div class="big">${t.i}</div><b>${t.t}</b><div class="sub">${t.d}</div></div><div class="quick"><div class="sub">Assicurazione</div><b>${fmtDate(v.insurance_expiry)}</b><div class="sub">${days(v.insurance_expiry)}</div></div><div class="quick"><div class="sub">Revisione</div><b>${fmtDate(v.inspection_expiry)}</b></div><div class="quick"><div class="sub">Ultimo intervento</div><b>${lastKm(v.id)}</b></div></div></div>${j?jobCard(j):'<div class="card sub">Nessuna lavorazione attiva.</div>'}`;window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'})}function jobCard(j){let order=['accepted','diagnosis','estimate','working','final_check','ready','delivered'];return `<div class="card"><div class="h2">${j.title}</div><div class="sub">${j.description||''}</div><div class="timeline" style="margin-top:10px">${order.map(s=>`<div class="step ${s===j.status?'on':''}">${statuses[s]}</div>`).join('')}</div><div class="sub" style="margin-top:8px">Consegna prevista: ${j.expected_delivery?new Date(j.expected_delivery).toLocaleString('it-IT'):'—'}</div></div>`}function toggleAdd(){addForm.classList.toggle('hidden')}async function addVehicle(){let p=carPlate.value.trim().toUpperCase().replace(/\s/g,'');if(!p)return alert('Inserisci la targa');try{await req('vehicles',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify({customer_id:C.id,plate:p,brand:carBrand.value.trim(),model:carModel.value.trim(),current_km:Number(carKm.value)||null,insurance_expiry:carInsurance.value||null,inspection_expiry:carInspection.value||null,source:'customer',verification_status:'pending'})});await loadHome();alert('Vettura aggiunta.')}catch(e){alert('Impossibile aggiungere la vettura.')}}async function newQuote(){if(!V.length)return alert('Aggiungi prima una vettura.');let cat=prompt('Scrivi: insurance per assicurazione oppure tyres per pneumatici','insurance');if(!['insurance','tyres'].includes(cat))return;let note=prompt('Note per l’officina','')||'';await req('quote_requests',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify({customer_id:C.id,vehicle_id:V[0].id,category:cat,status:'requested',customer_note:note})});await loadHome()}function switchTab(p,b){document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));b.classList.add('on');garagePane.classList.toggle('hidden',p!=='garage');historyPane.classList.toggle('hidden',p!=='history');quotesPane.classList.toggle('hidden',p!=='quotes');profilePane.classList.toggle('hidden',p!=='profile')}async function logout(){localStorage.removeItem(SK);S=null;home.classList.add('hidden');login.classList.remove('hidden')}(async()=>{S=loadS();if(S?.access_token){try{await loadHome()}catch(e){localStorage.removeItem(SK)}}})();</script></body></html>
